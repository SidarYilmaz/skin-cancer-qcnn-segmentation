# Quantum SAM V6 Configuration
model:
  name: QuantumSAM
  sam_type: vit_b
  sam_checkpoint: sam_vit_b_01ec64.pth
  image_size: 1024
  n_qubits: 8
  q_layers: 2

training:
  batch_size: 4
  epochs: 80
  lr: 1.0e-4
  encoder_lr: 5.0e-6
  unfreeze_blocks: 2
  weight_decay: 1.0e-4
  warmup_epochs: 5
  early_stopping: 15
  q_warmup_epochs: 2
  q_lr_multiplier: 5.0

loss:
  type: combined_focal_tversky_bce
  focal_gamma: 0.75
  tversky_alpha: 0.3
  tversky_beta: 0.7

data:
  dataset: ISIC2018_Task1
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  seed: 42
